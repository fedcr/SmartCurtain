mqtt:
  cover:
    - name: "SmartCurtain"
      command_topic: "homeassistant/cover/smartcurtain/set"
      position_topic: "homeassistant/cover/smartcurtain/position"
      set_position_topic: "homeassistant/cover/smartcurtain/set_position"
      state_topic: "homeassistant/cover/smartcurtain/state"
      availability_topic: "homeassistant/cover/smartcurtain/available"
      payload_open: "OPEN"
      payload_close: "CLOSE"
      payload_stop: "STOP"
      state_open: "open"
      state_closed: "closed"
      position_open: 0
      position_closed: 100

  binary_sensor:
    - name: "Window Radar Sensor"
      state_topic: "homeassistant/sensor/smartcurtain_radar/state"
      payload_on: "ON"
      payload_off: "OFF"
      device_class: motion
